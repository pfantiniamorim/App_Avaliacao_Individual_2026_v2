<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Relatório Individual — TPP 3º CECEM/2026</title>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;700;900&display=swap" rel="stylesheet"/>
<style>
  :root { --linha: #000; --cinza: #5e5e5e; --claro: #f3f3f4; --erro: #ba1a1a; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Public Sans', Arial, sans-serif; background: #e2e2e2; color: #000; padding: 24px 12px; }

  /* A folha. Em tela é um cartão centrado; na impressão vira a página. */
  .folha { width: 210mm; min-height: 297mm; margin: 0 auto; background: #fff; padding: 14mm 15mm; }

  .barra { display: flex; gap: 8px; justify-content: center; margin: 0 auto 20px; max-width: 210mm; }
  .barra a, .barra button, .barra select {
    font: 900 11px 'Public Sans', sans-serif; text-transform: uppercase; letter-spacing: .12em;
    padding: 12px 18px; border: 2px solid #000; background: #fff; color: #000; cursor: pointer; text-decoration: none;
  }
  .barra button { background: #000; color: #fff; }
  .barra select { min-width: 220px; }

  h1 { font-size: 19px; font-weight: 900; text-transform: uppercase; letter-spacing: -.02em; line-height: 1.1; }
  .cabecalho { border-bottom: 3px solid var(--linha); padding-bottom: 10px; margin-bottom: 14px; }
  .cabecalho p { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .18em; color: var(--cinza); }
  .cabecalho .edital { margin-top: 6px; letter-spacing: .05em; }

  h2 { font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: .18em;
       background: var(--linha); color: #fff; padding: 5px 8px; margin: 14px 0 8px; }

  table { width: 100%; border-collapse: collapse; }
  th, td { border: 1px solid var(--linha); padding: 5px 7px; font-size: 11px; text-align: left; vertical-align: top; }
  th { background: var(--claro); font-weight: 900; text-transform: uppercase; letter-spacing: .06em; font-size: 9.5px; }
  td.num, th.num { text-align: center; white-space: nowrap; }
  .rotulo { width: 34%; font-weight: 700; text-transform: uppercase; font-size: 9.5px; letter-spacing: .06em; color: var(--cinza); }
  .valor { font-weight: 900; text-transform: uppercase; }

  .nota { display: flex; align-items: stretch; border: 3px solid var(--linha); margin-top: 4px; }
  .nota .memorial { flex: 1; padding: 10px 12px; }
  .nota .memorial p { font-size: 10.5px; font-weight: 700; line-height: 1.7; }
  .nota .memorial code { font-family: inherit; font-weight: 900; }
  .nota .mf { background: var(--linha); color: #fff; padding: 12px 20px; text-align: center;
              display: flex; flex-direction: column; justify-content: center; min-width: 46mm; }
  .nota .mf span { font-size: 9px; font-weight: 900; letter-spacing: .22em; }
  .nota .mf strong { font-size: 40px; font-weight: 900; line-height: 1; display: block; margin-top: 4px; }
  .eliminado .mf { background: var(--erro); }

  .rodape { margin-top: 10mm; border-top: 1px solid var(--linha); padding-top: 6px;
            font-size: 8.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--cinza); }
  .vazio { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--cinza); padding: 8px 0; }
  .erro { color: var(--erro); }

  @media print {
    @page { size: A4; margin: 0; }
    body { background: #fff; padding: 0; }
    .barra { display: none; }
    /* Indicador de sincronização do AppUtils — nunca sai no papel. */
    #status-sync { display: none !important; }
    .folha { width: auto; min-height: 0; margin: 0; padding: 12mm 14mm; }
    h2 { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    th, .nota .mf { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>

<div class="barra">
  <a href="ranking.html">&larr; Ranking</a>
  <select id="seletor" aria-label="Escolher candidato"></select>
  <button id="btn-docx" type="button">Baixar .docx (SEI)</button>
  <button id="btn-imprimir" type="button">Imprimir / Salvar PDF</button>
</div>

<div class="folha" id="folha">
  <p class="vazio">CARREGANDO…</p>
</div>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/docx.js"></script>
<script>
(function () {
  var CFG = window.APP_CONFIG;
  var el = AppUtils.el;
  var dados = null;
  var idAtual = new URLSearchParams(location.search).get('id') || '';

  document.getElementById('btn-imprimir').addEventListener('click', function () { window.print(); });
  document.getElementById('btn-docx').addEventListener('click', baixarDocx);
  document.getElementById('seletor').addEventListener('change', function (e) {
    idAtual = e.target.value;
    history.replaceState(null, '', 'relatorio.html?id=' + encodeURIComponent(idAtual));
    render();
  });

  // Documento em português: número sempre com vírgula decimal.
  function n2(v) { return Number(v).toFixed(2).replace('.', ','); }

  // Memorial legível no papel: vírgula decimal e sinais × e ÷.
  function memorialLegivel(texto) {
    return String(texto || '')
      .replace(/(\d)\.(\d)/g, '$1,$2')
      .replace(/\*/g, '×')
      .replace(/\//g, '÷');
  }

  function linha(rotulo, valor, classe) {
    var tr = el('tr');
    tr.appendChild(el('td', 'rotulo', rotulo));
    tr.appendChild(el('td', 'valor' + (classe ? ' ' + classe : ''), valor));
    return tr;
  }

  function secao(pai, titulo) {
    pai.appendChild(el('h2', null, titulo));
    var t = el('table');
    pai.appendChild(t);
    return t;
  }

  function render() {
    var folha = document.getElementById('folha');
    folha.textContent = '';

    if (!dados) { folha.appendChild(el('p', 'vazio', 'CARREGANDO…')); return; }

    var cand = dados.ranking.find(function (c) { return c.id === idAtual; });
    if (!cand) {
      folha.appendChild(el('p', 'vazio erro', 'Candidato não encontrado. Escolha um na lista acima.'));
      return;
    }

    var r = cand.resultado;

    /* ---- Cabeçalho ---- */
    var ed = CFG.EDITAL || {};
    var cab = el('div', 'cabecalho');
    cab.appendChild(el('h1', null, 'Relatório Individual do ' + (ed.prova || 'Teste Profissional Prático')));
    cab.appendChild(el('p', null, (ed.unidade || '') + ' — ' + (ed.curso || '')));
    cab.appendChild(el('p', 'edital',
      (ed.numero || '') + ' · Local: ' + (ed.local || '') + ' · Viatura: ' + (ed.viatura || '')));
    folha.appendChild(cab);

    /* ---- Identificação ---- */
    var t1 = secao(folha, 'Identificação do candidato');
    t1.appendChild(linha('Nome de guerra', cand.nome || '—'));
    t1.appendChild(linha('Matrícula', cand.matricula || '—'));
    t1.appendChild(linha('Destinação da vaga',
      cand.categoria ? nomeCategoria(cand.categoria) : 'NÃO INFORMADA',
      cand.categoria ? '' : 'erro'));
    t1.appendChild(linha('Reserva do GBMOT', cand.gbmot ? 'SIM' : 'NÃO'));

    /* ---- Execução ---- */
    var t2 = secao(folha, 'Execução do percurso');
    t2.appendChild(linha('Tempo executado', cand.tempo || 'NÃO LANÇADO'));
    t2.appendChild(linha('Pontuação de tempo',
      r.pontuacaoTempo === null ? '—' : n2(r.pontuacaoTempo)));

    /* ---- Penalidades: resumo por infração ---- */
    folha.appendChild(el('h2', null, 'Penalidades apuradas'));
    var t3 = el('table');
    var cab3 = el('tr');
    ['Infração', 'Valor unitário', 'Ocorrências', 'Pontos'].forEach(function (c, i) {
      cab3.appendChild(el('th', i ? 'num' : null, c));
    });
    t3.appendChild(cab3);
    CFG.TABELA_PENALIDADES.forEach(function (p) {
      var qtd = cand.contagens[p.key] || 0;
      var elimin = AppUtils.isEliminatoria(p);
      var tr = el('tr');
      tr.appendChild(el('td', null, p.nome));
      tr.appendChild(el('td', 'num', elimin ? 'ELIMINATÓRIO' : '−' + n2(p.pontos)));
      tr.appendChild(el('td', 'num', String(qtd)));
      tr.appendChild(el('td', 'num' + (qtd && elimin ? ' erro' : ''),
        !qtd ? '—' : (elimin ? 'ELIMINADO' : '−' + n2(qtd * Number(p.pontos)))));
      t3.appendChild(tr);
    });
    var trTot = el('tr');
    trTot.appendChild(el('th', null, 'Total descontado'));
    trTot.appendChild(el('th', 'num', ''));
    trTot.appendChild(el('th', 'num', String(totalMarcacoes(cand))));
    trTot.appendChild(el('th', 'num', (r.pontosPen ? '−' : '') + n2(r.pontosPen)));
    t3.appendChild(trTot);
    folha.appendChild(t3);

    /* ---- Média final ---- */
    folha.appendChild(el('h2', null, 'Média final (MF)'));
    var nota = el('div', 'nota' + (r.eliminado ? ' eliminado' : ''));
    var memorial = el('div', 'memorial');
    memorial.appendChild(el('p', null, 'Fórmula do edital:'));
    memorial.appendChild(el('p', null, 'MF = [(PONTUAÇÃO DE TEMPO × 1,75) + (100 − PENALIDADES)] ÷ 2,75'));
    memorial.appendChild(el('p', null, 'Memorial de cálculo:'));
    memorial.appendChild(el('p', null, r.memorial ? memorialLegivel(r.memorial) : '—'));
    nota.appendChild(memorial);
    var caixaMf = el('div', 'mf');
    caixaMf.appendChild(el('span', null, r.eliminado ? 'SITUAÇÃO' : 'MÉDIA FINAL'));
    caixaMf.appendChild(el('strong', null,
      r.eliminado ? 'ELIM.' : (r.mf === null ? '—' : n2(r.mf))));
    nota.appendChild(caixaMf);
    folha.appendChild(nota);

    /* Sem campos de assinatura: a assinatura é digital, feita no SEI. */
    folha.appendChild(el('p', 'rodape',
      'Documento gerado pelo sistema de apuração do ' + (ed.provaSigla || 'TPP') + ' em ' +
      new Date().toLocaleString('pt-BR') +
      '. Confere com os registros da comissão. As penalidades são observadas pelos fiscais de exercício, ' +
      'avaliador de condução e avaliador de pista, conforme o edital.'));
  }

  /* Mesmo conteúdo da folha, em .docx — para colar no editor do SEI.
     Sem campos de assinatura: a assinatura é digital, feita lá. */
  function baixarDocx() {
    var cand = dados && dados.ranking.find(function (c) { return c.id === idAtual; });
    if (!cand) { alert('Escolha um candidato antes de baixar.'); return; }

    var r = cand.resultado;
    var ed = CFG.EDITAL || {};
    var doc = AppDocx.novo();

    doc.titulo('Relatório Individual do ' + (ed.prova || 'Teste Profissional Prático'));
    doc.subtitulo((ed.unidade || '') + ' — ' + (ed.curso || ''));
    doc.subtitulo((ed.numero || '') + ' · Local: ' + (ed.local || '') + ' · Viatura: ' + (ed.viatura || ''));

    doc.secao('Identificação do candidato');
    doc.ficha([
      ['Nome de guerra', cand.nome || '—'],
      ['Matrícula', cand.matricula || '—'],
      ['Destinação da vaga', cand.categoria ? nomeCategoria(cand.categoria) : 'NÃO INFORMADA'],
      ['Reserva do GBMOT', cand.gbmot ? 'SIM' : 'NÃO']
    ]);

    doc.secao('Execução do percurso');
    doc.ficha([
      ['Tempo executado', cand.tempo || 'NÃO LANÇADO'],
      ['Pontuação de tempo', r.pontuacaoTempo === null ? '—' : n2(r.pontuacaoTempo)]
    ]);

    doc.secao('Penalidades apuradas');
    var linhas = [['Infração', 'Valor unitário', 'Ocorrências', 'Pontos']];
    CFG.TABELA_PENALIDADES.forEach(function (p) {
      var qtd = cand.contagens[p.key] || 0;
      var elimin = AppUtils.isEliminatoria(p);
      linhas.push([
        p.nome,
        elimin ? 'ELIMINATÓRIO' : '−' + n2(p.pontos),
        String(qtd),
        !qtd ? '—' : (elimin ? 'ELIMINADO' : '−' + n2(qtd * Number(p.pontos)))
      ]);
    });
    linhas.push(['Total descontado', '', String(totalMarcacoes(cand)),
      (r.pontosPen ? '−' : '') + n2(r.pontosPen)]);
    doc.tabela(linhas, { cabecalho: true, total: true, larguras: [46, 20, 16, 18], centradas: [1, 2, 3] });

    doc.secao('Média final (MF)');
    doc.ficha([
      ['Fórmula do edital', 'MF = [(PONTUAÇÃO DE TEMPO × 1,75) + (100 − PENALIDADES)] ÷ 2,75'],
      ['Memorial de cálculo', r.memorial ? memorialLegivel(r.memorial) : '—'],
      [r.eliminado ? 'Situação' : 'Média final',
        r.eliminado ? 'ELIMINADO' : (r.mf === null ? '—' : n2(r.mf))]
    ]);

    doc.espaco();
    doc.paragrafo(
      'Documento gerado pelo sistema de apuração do ' + (ed.provaSigla || 'TPP') + ' em ' +
      new Date().toLocaleString('pt-BR') +
      '. Confere com os registros da comissão. As penalidades são observadas pelos fiscais de ' +
      'exercício, avaliador de condução e avaliador de pista, conforme o edital.',
      { tamanho: 8, cor: '5E5E5E' });

    var nome = String(cand.nome || cand.id).normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '').toUpperCase();
    AppDocx.baixar(doc, 'TPP-' + (ed.curso || '').replace(/[^\w]/g, '') + '-' + nome + '.docx');
  }

  function nomeCategoria(key) {
    var d = (CFG.VAGAS || []).find(function (x) { return x.key === key; });
    return d ? d.nome : key;
  }

  function totalMarcacoes(cand) {
    return Object.keys(cand.contagens).reduce(function (s, k) { return s + cand.contagens[k]; }, 0);
  }

  function preencherSeletor() {
    var sel = document.getElementById('seletor');
    sel.textContent = '';
    var vazio = el('option', null, '— escolher candidato —');
    vazio.value = '';
    sel.appendChild(vazio);

    // Lista em ordem alfabética, sem a posição no ranking: esta tela é
    // usada de frente para o candidato, então o dropdown não pode expor a
    // classificação de todo mundo antes da hora — só nome e matrícula.
    dados.ranking
      .slice()
      .sort(function (a, b) { return (a.nome || '').localeCompare(b.nome || ''); })
      .forEach(function (c) {
        var o = el('option', null, c.nome + (c.matricula ? '  (' + c.matricula + ')' : ''));
        o.value = c.id;
        sel.appendChild(o);
      });
    sel.value = idAtual;
  }

  AppUtils.iniciarPolling(function (data) {
    if (!data) return;
    dados = { ranking: data.ranking };
    preencherSeletor();
    render();
  });
})();
</script>
</body>
</html>
