<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>TPP — 3º CECEM/2026 · CBMDF</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script>
tailwind.config = { theme: { extend: {
  colors: { primary: "#000000", "surface-container-highest": "#e2e2e2" },
  borderRadius: { DEFAULT: "0px", lg: "0px", xl: "0px", full: "9999px" },
  fontFamily: { sans: ["Public Sans", "sans-serif"] }
}}};
</script>
<style>
  body { font-family: 'Public Sans', sans-serif; background-color: #000000; }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
</style>
</head>
<body class="bg-black text-white min-h-screen flex flex-col">
<main class="flex-grow flex flex-col items-center justify-center px-8 relative overflow-hidden min-h-screen">
<div class="z-10 w-full max-w-md flex flex-col items-center text-center">
  <!-- Marca -->
  <div class="mb-16 space-y-3">
    <h2 class="text-white text-lg md:text-xl font-bold tracking-[0.4em] opacity-80">CBMDF · DIREN · GBMOT</h2>
    <h1 class="text-white text-5xl md:text-7xl font-black uppercase leading-[0.85] tracking-tighter">
      3º<br/>CECEM<br/>2026
    </h1>
    <p class="text-white/60 text-xs font-bold uppercase tracking-[0.3em] pt-2">Teste Profissional Prático</p>
  </div>
  <!-- Ações -->
  <div class="w-full flex flex-col gap-4 mb-12">
    <button onclick="window.location.href='dashboard.html'" class="bg-white text-black font-black text-xl py-6 px-8 hover:bg-surface-container-highest active:scale-[0.98] transition-all flex justify-between items-center group w-full">
      <span class="uppercase tracking-widest text-left">DASHBOARD</span>
      <span class="material-symbols-outlined text-black translate-x-0 group-hover:translate-x-2 transition-transform">arrow_forward</span>
    </button>
    <button onclick="window.location.href='selecao.html'" class="bg-white text-black font-black text-xl py-6 px-8 hover:bg-surface-container-highest active:scale-[0.98] transition-all flex justify-between items-center group w-full">
      <span class="uppercase tracking-widest text-left">AVALIADOR</span>
      <span class="material-symbols-outlined text-black translate-x-0 group-hover:translate-x-2 transition-transform">arrow_forward</span>
    </button>
  </div>
</div>
</main>
</body>
</html>
