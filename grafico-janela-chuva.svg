<text x="124" y="574" font-size="12" fill="#0b0b0b"><tspan font-weight="700">A janela absorve a chuva.</tspan> Em tempo seco, 24 de 25 caem dentro dela &#8212; s&#243; RAFAEL (2:17) fica no plat&#244; de 100. Com +10 s s&#227;o 25 de 25.</text>
<text x="124" y="592" font-size="12" fill="#0b0b0b">Com +15 s, 1 aluno passa de 3:20 e tira 35 &#8212; n&#227;o zera, porque a reta segue sem degrau at&#233; 4:00 = 0.</text>
<text x="124" y="616" font-size="12" fill="#0b0b0b"><tspan font-weight="700" fill="#d03b3b">O que a janela n&#227;o resolve &#233; o n&#237;vel.</tspan> Num corte hipot&#233;tico de 70, a aprova&#231;&#227;o vai de 23 para 19 e depois 13 dos 25.</text>
<text x="124" y="634" font-size="12" fill="#0b0b0b">A chuva mexe no n&#237;vel, n&#227;o na ordem: se a turma inteira executa a etapa na mesma condi&#231;&#227;o, a classifica&#231;&#227;o n&#227;o muda.</text>
<text x="124" y="660" font-size="10.5" fill="#898781">Tempos do TPP da seletiva (tempo seco, percurso diferente do curso) &#8212; &#250;nica distribui&#231;&#227;o real dispon&#237;vel.</text>
<text x="124" y="676" font-size="10.5" fill="#898781">Tabela completa, segundo a segundo, em TABELA-NOTAS-CURSO-2-20-A-3-20.csv</text>
